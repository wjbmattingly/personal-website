oth}@keyframes k21{0%,80.000%{opacity:0;transform:none}82.273%,95.909%{opacity:1;transform:none}98.182%,100%{opacity:0;transform:none}}.k21{animation:k21 22s linear infinite both}@keyframes k22{0%,81.818%{opacity:0;transform:translateY(6px)}84.091%,95.909%{opacity:1;transform:none}98.182%,100%{opacity:0;transform:none}}.k22{animation:k22 22s linear infinite both}</style><rect width="1200" height="760" fill="#fffdf6"/><g class="k1"><text x="64" y="44" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7d5a2a" text-anchor="start" letter-spacing="2">STEP 1 / 4</text><text x="64" y="74" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1a17" text-anchor="start">Before seeing any Europeana data, the model trained on museum terms matches the labels 77% of the time.</text></g><g class="k2"><text x="64" y="44" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7d5a2a" text-anchor="start" letter-spacing="2">STEP 2 / 4</text><text x="64" y="74" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1a17" text-anchor="start">A few hundred labelled persons close most of the gap. After about 600, more data barely moves the score.</text></g><g class="k3"><text x="64" y="44" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7d5a2a" text-anchor="start" letter-spacing="2">STEP 3 / 4</text><text x="64" y="74" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1a17" text-anchor="start">But retrain on exactly the same data and the score can fall 5.5 points. One run is not a result.</text></g><g class="k4"><text x="64" y="44" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7d5a2a" text-anchor="start" letter-spacing="2">STEP 4 / 4</text><text x="64" y="74" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1a17" text-anchor="start">With two and a half times the data, three runs land within 1.4 points of each other.</text></g><g class="k5"><line x1="150" y1="640.0" x2="1080" y2="640.0" stroke="#e6dcc6" stroke-width="1"/><text x="136" y="645.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#867c68" text-anchor="end">75%</text><line x1="150" y1="520.0" x2="1080" y2="520.0" stroke="#e6dcc6" stroke-width="1"/><text x="136" y="525.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#867c68" text-anchor="end">80%</text><line x1="150" y1="400.0" x2="1080" y2="400.0" stroke="#e6dcc6" stroke-width="1"/><text x="136" y="405.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#867c68" text-anchor="end">85%</text><line x1="150" y1="280.0" x2="1080" y2="280.0" stroke="#e6dcc6" stroke-width="1"/><text x="136" y="285.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#867c68" text-anchor="end">90%</text><line x1="150" y1="160.0" x2="1080" y2="160.0" stroke="#e6dcc6" stroke-width="1"/><text x="136" y="165.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#867c68" text-anchor="end">95%</text><text x="150.0" y="666" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#867c68" text-anchor="middle">0</text><text x="295.3125" y="666" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-we