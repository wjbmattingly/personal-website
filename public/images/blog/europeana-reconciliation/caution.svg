r="start">Taking the top answer every time finds most links, but links one in eight people who should get ‘none’.</text></g><g class="k2"><text x="64" y="44" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7d5a2a" text-anchor="start" letter-spacing="2">STEP 2 / 4</text><text x="64" y="74" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1a17" text-anchor="start">Demanding more confidence halves those false links, at the cost of a few real ones.</text></g><g class="k3"><text x="64" y="44" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7d5a2a" text-anchor="start" letter-spacing="2">STEP 3 / 4</text><text x="64" y="74" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1a17" text-anchor="start">Asking the three models to agree does as well, with no threshold to tune.</text></g><g class="k4"><text x="64" y="44" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7d5a2a" text-anchor="start" letter-spacing="2">STEP 4 / 4</text><text x="64" y="74" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1a17" text-anchor="start">A second, unrelated model (Jev) as a final check cuts false links to one in thirty.</text></g><g class="k5"><text x="64" y="128" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#867c68" text-anchor="start" letter-spacing="1.5">364 HELD-OUT PERSONS · THE LABELS TAKEN AS CORRECT</text><text x="470" y="166" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#867c68" text-anchor="start">Labelled links found</text><text x="830" y="166" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#867c68" text-anchor="start">People wrongly linked</text><text x="470" y="186" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#867c68" text-anchor="start">(of 274)</text><text x="830" y="186" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#867c68" text-anchor="start">(of 90 who should get ‘none’)</text></g><g class="k6"><rect x="64" y="214" width="1072" height="96" rx="10" fill="#fbf6ea" stroke="#e6dcc6" stroke-width="1.5" /><text x="88" y="256" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1b1a17" text-anchor="start">Top answer</text><text x="88" y="284" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#867c68" text-anchor="start">94.6% of its links match the labels</text></g><g class="k7"><rect x="470" y="244" width="286.8" height="30" rx="4" fill="#4f7a4a" stroke="none" stroke-width="1.5" /></g><g class="k8"><text x="766.8" y="266" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a17" text-anchor="start">95.6%</text></g><g class="k9"><rect x="830" y="244" width="199.5" height="30" rx="4" fill="#a8432e" stroke="none" stroke-width="1.5" /></g><g class="k10"><text x="1039.5" y="266" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a17" text-anchor="start">13.3%</text></g><g class="k11"><rect x="64" y="326" width="1072" height="96" rx="10" fill="#fbf6ea" stroke="#e6dcc6" stroke-width="1.5" /><text x="88" y="368" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1b1a17" text-anchor="start">Only if probability ≥ 0.8</text><text x="88" y="396" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#867c68" text-anchor="start">97.3% of its links match the labels</text></g><g class="k12"><rect x="470" y="356" width="276.0" height="30" rx="4" fill="#4f7a4a" stroke="none" stroke-width="1.5" /></g><g class="k13"><text x="756.0" y="378" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a17" text-anchor="start">92.0%</text></g><g class="k14"><rect x="830" y="356" width="117.0" height="30" rx="4" fill="#a8432e" stroke="none" stroke-width="1.5" /></g><g class="k15"><text x="957.0" y="378" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a17" text-anchor="start">7.8%</text></g><g class="k16"><rect x="64" y="438" width="1072" height="96" rx="10" fill="#fbf6ea" stroke="#e6dcc6" stroke-width="1.5" /><text x="88" y="480" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1b1a17" text-anchor="start">Only if all three models agree</text><text x="88" y="508" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#867c68" text-anchor="start">97.7% of its links match the labels</text></g><g class="k17"><rect x="470" y="468" width="276.0" height="30" rx="4" fill="#4f7a4a" stroke="none" stroke-width="1.5" /></g><g class="k18"><text x="756.0" y="490" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a17" text-anchor="start">92.0%</text></g><g class="k19"><rect x="830" y="468" width="100.5" height="30" rx="4" fill="#a8432e" stroke="none" stroke-width="1.5" /></g><g class="k20"><text x="940.5" y="490" font-family="'Source Sans 3', 'Helvetica 