<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Animated funnel. 7,226,233 persons in the export; 4,957,515 have at least one candidate in a local copy of Wikidata; 3,605,904 are linked; 3,277,078 links have all three models agreeing; those links point to 597,296 distinct Wikidata people. Built from a 156 GB Wikidata dump on Yale&#x27;s Bouchet cluster with ten GPUs in about five hours of scoring and no API calls."><style>@keyframes k1{0%,0.833%{opacity:0;transform:translateY(6px)}2.917%,24.167%{opacity:1;transform:none}26.250%,100%{opacity:0;transform:none}}.k1{animation:k1 24s linear infinite both}@keyframes k2{0%,25.417%{opacity:0;transform:translateY(6px)}27.500%,49.167%{opacity:1;transform:none}51.250%,100%{opacity:0;transform:none}}.k2{animation:k2 24s linear infinite both}@keyframes k3{0%,50.417%{opacity:0;transform:translateY(6px)}52.500%,74.167%{opacity:1;transform:none}76.250%,100%{opacity:0;transform:none}}.k3{animation:k3 24s linear infinite both}@keyframes k4{0%,75.417%{opacity:0;transform:translateY(6px)}77.500%,95.833%{opacity:1;transform:none}97.917%,100%{opacity:0;transform:none}}.k4{animation:k4 24s linear infinite both}@keyframes k5{0%,2.500%{opacity:0;transform:translateY(6px)}4.583%,96.250%{opacity:1;transform:none}98.333%,100%{opacity:0;transform:none}}.k5{animation:k5 24s linear infinite both}@keyframes k6{0%,3.750%{opacity:1;transform:scaleX(0)}8.333%,96.250%{opacity:1;transform:scaleX(1)}98.333%,100%{opacity:0;transform:scaleX(1)}}.k6{animation:k6 24s linear infinite both;transform-box:fill-box;transform-origin:left center}@keyframes k7{0%,6.250%{opacity:0;transform:none}8.333%,96.250%{opacity:1;transform:none}98.333%,100%{opacity:0;transform:none}}.k7{animation:k7 24s linear infinite both}@keyframes k8{0%,26.667%{opacity:0;transform:translateY(6px)}28.750%,96.250%{opacity:1;transform:none}98.333%,100%{opacity:0;transform:none}}.k8{animation:k8 24s linear infinite both}@keyframes k9{0%,27.917%{opacity:1;transform:scaleX(0)}32.500%,96.250%{opacity:1;transform:scaleX(1)}98.333%,100%{opacity:0;transform:scaleX(1)}}.k9{animation:k9 24s linear infinite both;transform-box:fill-box;transform-origin:left center}@keyframes k10{0%,30.417%{opacity:0;transform:none}32.500%,96.250%{opacity:1;transform:none}98.333%,100%{opacity:0;transform:none}}.k10{animation:k10 24s linear infinite both}@keyframes k11{0%,51.667%{opacity:0;transform:translateY(6px)}53.750%,96.250%{opacity:1;transform:none}98.333%,100%{opacity:0;transform:none}}.k11{animation:k11 24s linear infinite both}@keyframes k12{0%,52.917%{opacity:1;transform:scaleX(0)}57.500%,96.250%{opacity:1;transform:scaleX(1)}98.333%,100%{opacity:0;transform:scaleX(1)}}.k12{animation:k12 24s linear infinite both;transform-box:fill-box;transform-origin:left center}@keyframes k13{0%,55.417%{opacity:0;transform:none}57.500%,96.250%{opacity:1;transform:none}98.333%,100%{opacity:0;transform:none}}.k13{animation:k13 24s linear infinite both}@keyframes k14{0%,56.667%{opacity:0;transform:translateY(6px)}58.750%,96.250%{opacity:1;transform:none}98.333%,100%{opacity:0;transform:none}}.k14{animation:k14 24s linear infinite both}@keyframes k15{0%,57.917%{opacity:1;transform:scaleX(0)}62.500%,96.250%{opacity:1;transform:scaleX(1)}98.333%,100%{opacity:0;transform:scaleX(1)}}.k15{animation:k15 24s linear infinite both;transform-box:fill-box;transform-origin:left center}@keyframes k16{0%,60.417%{opacity:0;transform:none}62.500%,96.250%{opacity:1;transform:none}98.333%,100%{opacity:0;transform:none}}.k16{animation:k16 24s linear infinite both}@keyframes k17{0%,76.667%{opacity:0;transform:translateY(6px)}78.750%,96.250%{opacity:1;transform:none}98.333%,100%{opacity:0;transform:none}}.k17{animation:k17 24s linear infinite both}@keyframes k18{0%,77.917%{opacity:1;transform:scaleX(0)}82.500%,96.250%{opacity:1;transform:scaleX(1)}98.333%,100%{opacity:0;transform:scaleX(1)}}.k18{animation:k18 24s linear infinite both;transform-box:fill-box;transform-origin:left center}@keyframes k19{0%,80.417%{opacity:0;transform:none}82.500%,96.250%{opacity:1;transform:none}98.333%,100%{opacity:0;transform:none}}.k19{animation:k19 24s linear infinite both}@keyframes k20{0%,5.000%{opacity:0;transform:translateY(6px)}7.083%,96.250%{opacity:1;transform:none}98.333%,100%{opacity:0;transform:none}}.k20{animation:k20 24s linear infinite both}@keyframes k21{0%,6.667%{opacity:0;transform:translateY(8px)}8.750%,96.250%{opacity:1;transform:none}98.333%,100%{opacity:0;transform:none}}.k21{animation:k21 24s linear infinite both}@keyframes k22{0%,8.333%{opacity:0;transform:translateY(8px)}10.417%,96.250%{opacity:1;transform:none}98.333%,100%{opacity:0;transform:none}}.k22{animation:k22 24s linear infinite both}@keyframes k23{0%,10.000%{opacity:0;transform:translateY(8px)}12.083%,96.250%{opacity:1;transform:none}98.333%,100%{opacity:0;transform:none}}.k23{animation:k23 24s linear infinite both}@keyframes k24{0%,11.667%{opacity:0;transform:translateY(8px)}13.750%,96.250%{opacity:1;transform:none}98.333%,100%{opacity:0;transform:none}}.k24{animation:k24 24s linear infinite both}</style><rect width="1200" height="760" fill="#fffdf6"/><g class="k1"><text x="64" y="44" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7d5a2a" text-anchor="start" letter-spacing="2">STEP 1 / 4</text><text x="64" y="74" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1a17" text-anchor="start">The whole export: every person in Europeana’s records with no identifier yet.</text></g><g class="k2"><text x="64" y="44" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7d5a2a" text-anchor="start" letter-spacing="2">STEP 2 / 4</text><text x="64" y="74" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1a17" text-anchor="start">Two thirds have at least one plausible namesake in a local copy of Wikidata. Only those go to the models.</text></g><g class="k3"><text x="64" y="44" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7d5a2a" text-anchor="start" letter-spacing="2">STEP 3 / 4</text><text x="64" y="74" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1a17" text-anchor="start">The models link nearly three quarters of them; most links are made with all three models agreeing.</text></g><g class="k4"><text x="64" y="44" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7d5a2a" text-anchor="start" letter-spacing="2">STEP 4 / 4</text><text x="64" y="74" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1a17" text-anchor="start">Those links point to fewer than 600,000 people: the same person is catalogued again and again.</text></g><g class="k5"><text x="64" y="166" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a17" text-anchor="start">Persons in the export</text></g><g class="k6"><rect x="440" y="144" width="640.0" height="36" rx="4" fill="#867c68" stroke="none" stroke-width="1.5" /></g><g class="k7"><text x="1092.0" y="169" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a17" text-anchor="start">7,226,233</text></g><g class="k8"><text x="64" y="254" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a17" text-anchor="start">With a candidate in local Wikidata</text></g><g class="k9"><rect x="440" y="232" width="439.0682669656514" height="36" rx="4" fill="#46607a" stroke="none" stroke-width="1.5" /></g><g class="k10"><text x="891.0682669656514" y="257" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a17" text-anchor="start">4,957,515  (68.6%)</text></g><g class="k11"><text x="64" y="342" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a17" text-anchor="start">Linked to a Wikidata person</text></g><g class="k12"><rect x="440" y="320" width="319.36121627963007" height="36" rx="4" fill="#7d5a2a" stroke="none" stroke-width="1.5" /></g><g class="k13"><text x="771.3612162796301" y="345" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a17" text-anchor="start">3,605,904  (49.9%)</text></g><g class="k14"><text x="64" y="430" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a17" text-anchor="start">…with all three models agreeing</text></g><g class="k15"><rect x="440" y="408" width="290.2383468675865" height="36" rx="4" fill="#4f7a4a" stroke="none" stroke-width="1.5" /></g><g class="k16"><text x="742.2383468675864" y="433" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a17" text-anchor="start">3,277,078  (45.4%)</text></g><g class="k17"><text x="64" y="518" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a17" text-anchor="start">Distinct Wikidata people</text></g><g class="k18"><rect x="440" y="496" width="52.90023723287085" height="36" rx="4" fill="#a8432e" stroke="none" stroke-width="1.5" /></g><g class="k19"><text x="504.90023723287084" y="521" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a17" text-anchor="start">597,296</text></g><g class="k20"><text x="64" y="600" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#867c68" text-anchor="start" letter-spacing="1.5">HOW IT RAN · YALE’S BOUCHET CLUSTER</text></g><g class="k21"><rect x="64" y="616" width="256" height="96" rx="10" fill="#fbf6ea" stroke="#e6dcc6" stroke-width="1.5" /><text x="82" y="656" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#7d5a2a" text-anchor="start">156 GB</text><text x="82" y="686" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#867c68" text-anchor="start">Wikidata dump → 13.7M people</text></g><g class="k22"><rect x="336" y="616" width="256" height="96" rx="10" fill="#fbf6ea" stroke="#e6dcc6" stroke-width="1.5" /><text x="354" y="656" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#7d5a2a" text-anchor="start">10 GPUs</text><text x="354" y="686" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#867c68" text-anchor="start">5 × RTX PRO 6000 · 5 × RTX 5000</text></g><g class="k23"><rect x="608" y="616" width="256" height="96" rx="10" fill="#fbf6ea" stroke="#e6dcc6" stroke-width="1.5" /><text x="626" y="656" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#7d5a2a" text-anchor="start">≈5 hours</text><text x="626" y="686" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#867c68" text-anchor="start">of scoring, three models per person</text></g><g class="k24"><rect x="880" y="616" width="256" height="96" rx="10" fill="#fbf6ea" stroke="#e6dcc6" stroke-width="1.5" /><text x="898" y="656" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#7d5a2a" text-anchor="start">0</text><text x="898" y="686" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#867c68" text-anchor="start">calls to outside models or APIs</text></g></svg>