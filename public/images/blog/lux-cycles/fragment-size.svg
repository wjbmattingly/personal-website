ty:1;transform:none}98.182%,100%{opacity:0;transform:none}}.k19{animation:k19 22s linear infinite both}@keyframes k20{0%,75.909%{opacity:0;transform:none}78.182%,95.909%{opacity:1;transform:none}98.182%,100%{opacity:0;transform:none}}.k20{animation:k20 22s linear infinite both}@keyframes k21{0%,2.727%{opacity:0;transform:none}5%,95.909%{opacity:1;transform:none}98.182%,100%{opacity:0;transform:none}}.k21{animation:k21 22s linear infinite both}@media (prefers-reduced-motion:reduce){.a{animation:none!important;opacity:1!important;transform:none!important}.x{opacity:0!important}}</style><rect width="1200" height="760" fill="#fffdf6"/><g class="a k1 x cap cap1"><text x="64" y="44" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7d5a2a" text-anchor="start" letter-spacing="2">STEP 1 / 4</text><text x="64" y="74" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1a17" text-anchor="start">Shown the whole knot at once, five passes still leave 2,138 of its 2,190 concepts in a loop.</text></g><g class="a k2 x cap cap2"><text x="64" y="44" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7d5a2a" text-anchor="start" letter-spacing="2">STEP 2 / 4</text><text x="64" y="74" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1a17" text-anchor="start">Cut into fragments of 200, five passes leave 357 concepts in a loop, for less money.</text></g><g class="a k3 x cap cap3"><text x="64" y="44" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7d5a2a" text-anchor="start" letter-spacing="2">STEP 3 / 4</text><text x="64" y="74" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1a17" text-anchor="start">Cut into fragments of 60, three passes leave none.</text></g><g class="a k4 cap cap4"><text x="64" y="44" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7d5a2a" text-anchor="start" letter-spacing="2">STEP 4 / 4</text><text x="64" y="74" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1a17" text-anchor="start">Smaller pieces did more for less: $0.28 to clear the knot, against $0.57 to barely dent it.</text></g><g class="a k5"><text x="64" y="128" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#867c68" text-anchor="start" letter-spacing="1.5">THE 2,190-CONCEPT LOOP · GEMINI 3.1 FLASH-LITE · UP TO FIVE PASSES</text><text x="470" y="166" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#867c68" text-anchor="start">Concepts still in a loop</text><text x="470" y="186" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#867c68" text-anchor="start">(of 2,190)</text><text x="860" y="166" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#867c68" text-anchor="start">Cost of all passes</text><text x="860" y="186" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#867c68" text-anchor="start">(Gemini API)</text></g><g class="a k6"><rect x="64" y="214" width="1072" height="96" rx="10" fill="#fbf6ea" stroke="#e6dcc6" stroke-width="1.5"/><text x="88" y="256" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1b1a17" text-anchor="start">Shown whole</text><text x="88" y="284" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#867c68" text-anchor="start">about ten deletions accepted a pass · 5 passes</text></g><g class="a k7"><rect x="470" y="244" width="283.11" height="30" rx="4" fill="#a8432e"/></g><g class="a k8"><text x="763.11" y="266" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a17" text-anchor="start">2,138</text></g><g class="a k9"><rect x="860" y="244" width="200" height="30" rx="4" fill="#46607a"/></g><g class="a k10"><text x="1070" y="266" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a17" text-anchor="start">$0.57</text></g><g class="a k11"><rect x="64" y="326" width="1072" height="96" rx="10" fill="#fbf6ea" stroke="#e6dcc6" stroke-width="1.5"/><text x="88" y="368" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1b1a17" text-anchor="start">Fragments of 200</text><text x="88" y="396" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#867c68" text-anchor="start">9 fragments in the first pass · 5 passes</text></g><g class="a k12"><rect x="470" y="356" width="47.27" height="30" rx="4" fill="#a8432e"/></g><g class="a k13"><text x="527.27" y="378" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a17" text-anchor="start">357</text></g><g class="a k14"><rect x="860" y="356" width="108.77" height="30" rx="4" fill="#46607a"/></g><g class="a k15"><text x="978.77" y="378" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a17" text-anchor="start">$0.31</text></g><g class="a k16"><rect x="64" y="438" width="1072" height="96" rx="10" fill="#fbf6ea" stroke="#e6dcc6" stroke-width="1.5"/><text x="88" y="480" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1b1a17" text-anchor="start">Fragments of 60</text><text x="88" y="508" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#867c68" text-anchor="start">35, then 10, then 1 fragment · 3 passes</text></g><g class="a k17"><text x="480" y="490" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#4f7a4a" text-anchor="start">0</text></g><g class="a k18"><rect x="860" y="468" width="98.25" height="30" rx="4" fill="#46607a"/></g><g class="a k19"><text x="968.25" y="490" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1b1a17" text-anchor="start">$0.28</text></g><g class="a k20"><rect x="64" y="438" width="1072" height="96" rx="10" fill="none" stroke="#4f7a4a" stroke-width="2"/></g><g class="a k21"><text x="64" y="690" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#867c68" text-anchor="start" font-style="italic">One run of each, recorded in the lux-concepts-scc README. Same model and instructions each time; only the size of the piece the model is shown changes.</text></g></svg>