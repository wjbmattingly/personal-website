4.0" y="44.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7d5a2a" text-anchor="start" letter-spacing="2">STEP 2 / 4</text><text x="64.0" y="74.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1a17" text-anchor="start">Training time against the most GPU memory each run needed (mean of three seeds).</text></g><g class="k3"><text x="64.0" y="44.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7d5a2a" text-anchor="start" letter-spacing="2">STEP 3 / 4</text><text x="64.0" y="74.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1a17" text-anchor="start">Read these as rough guides: a B200 is several times faster than an RTX 5000.</text></g><g class="k4"><text x="64.0" y="44.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7d5a2a" text-anchor="start" letter-spacing="2">STEP 4 / 4</text><text x="64.0" y="74.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#1b1a17" text-anchor="start">kev-4b: 22 minutes and 12 GB of memory. It would fit on a 32 GB card.</text></g><g class="k5"><text x="140.0" y="164.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#867c68" text-anchor="start" letter-spacing="1.5">TRAINING TIME (MINUTES) · 2 EPOCHS, 2,780 DECISIONS</text><line x1="150.0" y1="640.0" x2="1100.0" y2="640.0" stroke="#e6dcc6" stroke-width="1" stroke-linecap="round"/><text x="138.0" y="645.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#867c68" text-anchor="end">0</text><line x1="150.0" y1="527.5" x2="1100.0" y2="