none" stroke-width="0"/><text x="349.1" y="509.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1b1a17" text-anchor="start">JevK5-9B</text></g><g class="k19"><circle cx="340.9" cy="566.2" r="7" fill="#a8432e" stroke="none" stroke-width="0"/><text x="352.9" y="571.2" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1b1a17" text-anchor="start">JEV-9B</text></g><g class="k20"><circle cx="594.6" cy="486.8" r="7" fill="#a8432e" stroke="none" stroke-width="0"/><text x="582.6" y="478.8" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1b1a17" text-anchor="end">Open-Jev-9B</text></g><g class="k21"><circle cx="622.1" cy="488.0" r="7" fill="#a8432e" stroke="none" stroke-width="0"/><text x="634.1" y="504.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1b1a17" text-anchor="start">openjev-NLI-4B</text></g><g class="k22"><circle cx="656.4" cy="577.1" r="7" fill="#a8432e" stroke="none" stroke-width="0"/><text x="668.4" y="582.1" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1b1a17" text-anchor="start">GEV-26B</text></g><g class="k23"><circle cx="671.5" cy="434.1" r="7" fill="#a8432e" stroke="none" stroke-width="0"/><text x="683.5" y="450.1" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1b1a17" text-anchor="start">JEV-27B</text></g><g class="k24"><circle cx="672.5" cy="427.5" r="7" fill="#a8432e" stroke="none" stroke-width="0"/><text x="684.5" y="421.5" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1b1a17" text-anchor="start">kev-27b</text></g><g class="k25"><circle cx="795.1" cy="539.8" r="7" fill="#a8432e" stroke="none" stroke-width="0"/><text x="807.1" y="544.8" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1b1a17" text-anchor="start">decider-35B-A3B</text></g><g class="k26"><circle cx="1045.8" cy="235.0" r="7" fill="#a8432e" stroke="none" stroke-width="0"/><text x="1033.8" y="240.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1b1a17" text-anchor="end">Open-Jev-27B</text></g><g class="k27"><rect x="620.0" y="196.0" width="470.0" height="118.0" rx="10" fill="#fbf6ea" stroke="#e6dcc6" stroke-width="1.5" /><text x="640.0" y="226.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1b1a17" text-anchor="start">Not a speed benchmark</text><text x="640.0" y="252.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#867c68" text-anchor="start">The fastest cards ran the largest models, the slowest the</text><text x="640.0" y="272.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#867c68" text-anchor="start">smallest. Memory also depends on the batch sizes we chose</text><text x="640.0" y="294.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#867c68" text-anchor="start">and on gradient checkpointing; neither is a minimum.</text></g><g class="k28"><circle cx="264.9" cy="557.1" r="15" fill="none" stroke="#4f7a4a" stroke-width="2.5"/><line x1="454.0" y1="190.0" x2="454.0" y2="640.0" stroke="#4f7a4a" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 5"/><text x="462.0" y="208.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4f7a4a" text-anchor="start">32 GB card</text></g></svg>