text-anchor="middle">80 GB</text><text x="1100.0" y="666.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#867c68" text-anchor="middle">100 GB</text><text x="625.0" y="696.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#867c68" text-anchor="middle">peak GPU memory during training</text></g><g class="k6"><circle cx="160.0" cy="118.0" r="8" fill="#46607a" stroke="none" stroke-width="0"/><text x="176.0" y="124.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1b1a17" text-anchor="start">RTX 5000 Ada · 32 GB</text></g><g class="k7"><circle cx="460.0" cy="118.0" r="8" fill="#c8862a" stroke="none" stroke-width="0"/><text x="476.0" y="124.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1b1a17" text-anchor="start">RTX PRO 6000 · 96 GB</text></g><g class="k8"><circle cx="760.0" cy="118.0" r="8" fill="#a8432e" stroke="none" stroke-width="0"/><text x="776.0" y="124.0" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1b1a17" text-anchor="start">B200 · 180 GB</text></g><g class="k9"><circle cx="214.3" cy="539.9" r="7" fill="#46607a" stroke="none" stroke-width="0"/><text x="204.3" y="557.9" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1b1a17" text-anchor="end">decider-2b</text></g><g class="k10"><circle cx="220.3" cy="626.9" r="7" fill="#46607a" stroke="none" stroke-width="0"/><text x="232.3" y="642.9" font-family="'Source Sans 3', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1b1a17" text-anchor="start">von</text></g><g class="k11"><circle cx="228.9" cy="625.0" r="7" fill="#46607a" stroke="none" stroke-width="0"/><t